name: morphinet_hyperparameter_sweep
description: Hyperparameter optimization for MorphiNet three-stage cardiac reconstruction pipeline

# Optimization strategy
method: bayes  # Bayesian optimization for efficient search
metric:
  goal: maximize
  name: best_eval_score  # Main validation metric from pipeline

# Early stopping to save computation
early_terminate:
  type: hyperband
  min_iter: 3
  max_iter: 20
  s: 2

# Hyperparameter search space
parameters:
  # Training parameters
  lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  
  batch_size:
    value: 1  # Fixed for data processing capability and computation efficiency
  
  # Loss coefficients for multi-task learning
  lambda_0:  # Chamfer distance loss coefficient
    distribution: uniform
    min: 0.5
    max: 1.0
  
  lambda_1:  # Laplacian smoothing loss coefficient
    distribution: uniform
    min: 0.5
    max: 1.0
  
  sigmoid_scale_factor:
    distribution: uniform
    min: 0.1
    max: 1.0
  
  mask_threshold:
    distribution: uniform
    min: 0.05
    max: 0.2
  
  # Model architecture parameters
  filters:
    values: 
      - [8, 16, 32, 64, 128]     # Default - smaller model
      - [16, 32, 64, 128, 256]   # Larger model
      - [12, 24, 48, 96, 192]    # Intermediate model
  
  layers:
    values:
      - [1, 2, 2, 4]    # Default ResNet layers
      - [2, 3, 4, 6]    # Deeper ResNet
      - [1, 1, 2, 2]    # Shallower ResNet
  
  hidden_features_gsn:
    values: [32, 64, 128]  # GSN hidden features
  
  # Training strategy parameters
  iteration:  # Distance field warping iterations
    value: 10  # Fixed for computation efficiency
  
  crop_window_size:
    values:
      - [96, 96, 96]     # Smaller crop - faster training
      - [128, 128, 128]  # Default crop size
      - [160, 160, 160]  # Larger crop - more context
  
  # Epoch distribution (total will be 200)
  pretrain_epochs:  # UNet training epochs
    values: [60, 80, 100]
  
  train_epochs:  # ResNet training epochs  
    values: [30, 40, 50]
  
  # Data augmentation and preprocessing
  cache_rate:
    values: [0.8, 1.0]  # Data caching for speed vs memory
  
  # Fixed parameters for consistency
  max_samples:
    value: 50  # Limited samples for sweep efficiency
  
  max_epochs:
    value: 200  # Total epochs (distributed across phases)
  
  validation_modality:
    value: "ct"  # Focus on CT validation
  
  mode:
    value: "online"  # Online logging for sweep tracking
  
  # Checkpoint and reproducibility
  val_interval:
    value: 5  # Validate every 5 epochs during sweep
  
  pixdim:
    value: [8, 8, 8]  # Fixed spacing for consistency
  
  num_classes:
    value: 4  # Fixed architecture parameter
  
  subdiv_levels:
    value: 2  # Fixed GSN parameter
  
  upscale_ratio:
    value: 2  # Fixed ResNet parameter